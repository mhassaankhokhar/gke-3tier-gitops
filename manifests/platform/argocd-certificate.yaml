# Argo CD's serving certificate. argocd-server reads argocd-server-tls and
# reloads on renewal; no ingress involved.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-server-tls
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  secretName: argocd-server-tls
  dnsNames:
    - argo.mhassankhokhar.site
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
