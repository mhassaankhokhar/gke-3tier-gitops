# Public TLS certificate and Gateway. In istio-system because the gateway
# reads certificates from its own namespace.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gke-3tier-tls
  namespace: istio-system
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  secretName: gke-3tier-tls
  dnsNames:
    - gke-3tier.mhassankhokhar.site
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: web
  namespace: istio-system
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  # Matches the label set on the gateway chart's pods.
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - gke-3tier.mhassankhokhar.site
      # Port 80 only redirects to 443.
      tls:
        httpsRedirect: true
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        - gke-3tier.mhassankhokhar.site
      tls:
        mode: SIMPLE
        # Must be in this namespace, or the listener serves nothing.
        credentialName: gke-3tier-tls
---
# Grafana's certificate (tailnet-only, but browsers expect HTTPS on this
# domain). DNS-01, because the CGNAT address can't be validated over HTTP.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-tls
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  secretName: grafana-tls
  dnsNames:
    - grafana.mhassankhokhar.site
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
