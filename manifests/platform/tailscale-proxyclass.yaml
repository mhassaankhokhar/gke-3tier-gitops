# Keeps Tailscale proxy pods (which carry admin sessions) on the stable pool.
# Referenced per Service by annotation, not as the chart default: the default is
# read before this CRD exists.
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: stable-pool
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  statefulSet:
    pod:
      nodeSelector:
        workload: stateful
