# Created here because the ExternalSecret below lands in it before the
# monitoring chart runs.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  annotations:
    # Before the ExternalSecret in this same directory.
    argocd.argoproj.io/sync-wave: "-2"
---
# Grafana's admin login from Secret Manager (used via
# grafana.admin.existingSecret in 17-monitoring.yaml). The chart's generated
# password changes on every Argo CD render. Key names are the chart defaults.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    template:
      type: Opaque
      data:
        admin-user: admin
        admin-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: grafana-admin-password
