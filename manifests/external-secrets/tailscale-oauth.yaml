# The Tailscale operator's OAuth client, pre-created as operator-oauth (the
# chart's documented option). Key names are fixed by the chart.
apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: operator-oauth
  data:
    - secretKey: client_id
      remoteRef:
        key: tailscale-oauth-client-id
    - secretKey: client_secret
      remoteRef:
        key: tailscale-oauth-client-secret
