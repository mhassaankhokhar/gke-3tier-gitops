# The Postgres application password, in both namespaces that need it.
#
# Two ExternalSecrets rather than one, because a Kubernetes Secret is
# namespace-scoped and cannot be read across namespaces. That constraint is why
# the password is supplied at all: CloudNativePG will happily generate one, but
# it lands only in the database namespace, where the api pods cannot reach it.
#
# kubernetes.io/basic-auth with a username key is the shape CloudNativePG
# requires for bootstrap.initdb.secret, and the username must equal the owner
# named there — `app` in manifests/postgres/cluster.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-app-credentials
  namespace: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: postgres-app-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        username: app
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: postgres-app-password
