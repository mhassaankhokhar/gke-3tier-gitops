# The Postgres app password for the database namespace (the app namespace's
# copy is in manifests/app/base). basic-auth with username `app`, as
# CloudNativePG's bootstrap.initdb.secret requires.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-app-credentials
  namespace: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: postgres-app-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        username: app
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: postgres-app-password
