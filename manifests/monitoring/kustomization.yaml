# Dashboards as ConfigMaps, so Git is the source of truth. Grafana's sidecar
# loads ConfigMaps labelled grafana_dashboard=1 from all namespaces; Grafana
# re-reads them every 30s.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

configMapGenerator:
  - name: dashboard-mesh-traffic
    files:
      - mesh-traffic.json=dashboards/mesh-traffic.json
  - name: dashboard-sidecar-cost
    files:
      - sidecar-cost.json=dashboards/sidecar-cost.json
  - name: dashboard-where-the-wait-is
    files:
      - where-the-wait-is.json=dashboards/where-the-wait-is.json

generatorOptions:
  # The sidecar selects on this label; without it the ConfigMap is ignored.
  labels:
    grafana_dashboard: "1"
  # Stable names: nothing mounts these, and a hash suffix would orphan old objects.
  disableNameSuffixHash: true
