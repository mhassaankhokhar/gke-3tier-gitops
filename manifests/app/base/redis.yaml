# Redis: the api's cache for the summary aggregation. Stable pool, one
# replica, no persistence; a miss falls through to Postgres.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      nodeSelector:
        workload: stateful
      containers:
        - name: redis
          image: redis:8.2-alpine
          args:
            # No persistence: it is a cache.
            - "--save"
            - ""
            - "--appendonly"
            - "no"
            # Bounded with LRU eviction, so a full cache evicts instead of OOMing or
            # refusing writes. 64mb under the 128Mi container limit leaves process headroom.
            - "--maxmemory"
            - "64mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
          ports:
            - containerPort: 6379
              name: tcp-redis
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    # tcp- prefix so Istio treats it as TCP instead of sniffing for HTTP.
    - name: tcp-redis
      port: 6379
      targetPort: 6379
