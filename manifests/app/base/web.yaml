# The web tier: serves the page, calls the api, keeps sessions in Redis.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
automountServiceAccountToken: false
---
# A Rollout, like api. A new web version can break just as easily, and it is
# the one users actually see — so it gets the same 20/50/100 walk, with the
# difference that this traffic arrives from the internet rather than from
# inside the mesh.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: web
spec:
  replicas: 2
  revisionHistoryLimit: 2
  strategy:
    canary:
      canaryService: web-canary
      stableService: web-stable
      trafficRouting:
        istio:
          virtualService:
            name: web
            routes:
              - primary
      steps:
        - setWeight: 20
        - pause: { duration: 60s }
        - setWeight: 50
        - pause: { duration: 60s }
        - setWeight: 100
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      serviceAccountName: web
      nodeSelector:
        workload: stateless
      containers:
        - name: web
          image: web
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: API_HOST
              value: http://api.app.svc.cluster.local
            - name: REDIS_URL
              value: redis://redis.app.svc.cluster.local:6379
            # Signs the session cookie. Rotating it invalidates every session,
            # so it is held once in Secret Manager rather than regenerated on
            # each deploy — a fresh value per rollout would log everyone out.
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: web-session-secret
                  key: secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: web-stable
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: web-canary
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
# The public route.
#
# Attached to the Gateway in istio-system, so this governs traffic arriving from
# the internet — unlike the api VirtualService, which has no gateways field and
# therefore only affects mesh-internal calls.
#
# Weights here are the resting state; Argo Rollouts rewrites them on the route
# named `primary` while a canary runs and settles them back afterwards.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: web
spec:
  hosts:
    - gke-3tier.mhassankhokhar.site
  gateways:
    - istio-system/web
  http:
    - name: primary
      route:
        - destination:
            host: web-stable
          weight: 100
        - destination:
            host: web-canary
          weight: 0
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web-session-secret
  namespace: app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: web-session-secret
  data:
    - secretKey: secret
      remoteRef:
        key: web-session-secret
