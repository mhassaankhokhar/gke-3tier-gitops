# The web tier: nginx serving the SPA and proxying /api to the api.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
automountServiceAccountToken: false
---
# A Rollout like api, with the same canary steps; this traffic comes from the gateway.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: web
spec:
  replicas: 2
  revisionHistoryLimit: 2
  strategy:
    canary:
      canaryService: web-canary
      stableService: web-stable
      trafficRouting:
        istio:
          virtualService:
            name: web
            routes:
              - primary
      steps:
        - setWeight: 20
        - pause: { duration: 60s }
        - setWeight: 50
        - pause: { duration: 60s }
        - setWeight: 100
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      serviceAccountName: web
      nodeSelector:
        workload: stateless
      containers:
        - name: web
          image: web
          ports:
            # Unprivileged port, so nginx runs as non-root.
            - containerPort: 8080
              name: http
          # No environment: the bundle has no API URL (nginx proxies /api).
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          # Readiness checks the api; failing removes the pod from the Service.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          # Liveness hits /healthz, which touches nothing else.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            # Catches a wedged process, not a slow one.
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: web-stable
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: web-canary
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
# The public route, bound to the istio-system Gateway. Rollouts rewrites the
# `primary` route weights during a canary; Git holds the resting state.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: web
spec:
  hosts:
    - gke-3tier.mhassankhokhar.site
  gateways:
    - istio-system/web
  http:
    - name: primary
      route:
        - destination:
            host: web-stable
          weight: 100
        - destination:
            host: web-canary
          weight: 0
