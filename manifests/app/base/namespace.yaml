# The application namespace, and the one label that puts it in the mesh.
#
# istio-injection=enabled is what makes istiod inject an Envoy sidecar into
# every pod created here. Nothing else in these manifests mentions Envoy — that
# is the point of a mesh: the proxy arrives without the workload asking for it.
#
# Postgres is deliberately NOT in this namespace. CloudNativePG names Istio
# sidecars as a cause of connectivity failures during startup, and it does its
# own TLS, so it lives in `database` with no label.
apiVersion: v1
kind: Namespace
metadata:
  name: app
  labels:
    istio-injection: enabled
