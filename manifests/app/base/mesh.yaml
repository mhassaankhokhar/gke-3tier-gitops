# STRICT mTLS for the namespace: PERMISSIVE would accept plaintext too.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: app
spec:
  mtls:
    mode: STRICT
---
# Deny by default: an empty DENY closes the namespace, so every ALLOW below is deliberate.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: deny-all
  namespace: app
spec:
  {}
---
# api accepts calls only from web's service account (verified via mTLS), not
# from the whole namespace.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: api-allow-web
  namespace: app
spec:
  selector:
    matchLabels:
      app: api
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/app/sa/web"]
      to:
        - operation:
            # All CRUD verbs.
            methods: ["GET", "POST", "PATCH", "DELETE"]
            paths: ["/api/*"]
---
# redis accepts calls only from api.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: redis-allow-api
  namespace: app
spec:
  selector:
    matchLabels:
      app: redis
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/app/sa/api"]
---
---
# web accepts calls only from the ingress gateway's identity, not all of istio-system.
# Without it: 403 rbac_access_denied_matched_policy[none].
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: web-allow-gateway
  namespace: app
spec:
  selector:
    matchLabels:
      app: web
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/istio-system/sa/istio-ingressgateway"]

