# Temporary, and only because of an ordering mistake.
#
# The session secret was removed in the same commit that replaced the web tier.
# The new version does not use it — but the previous ReplicaSet still mounts it,
# and Argo Rollouts keeps that ReplicaSet as `stable` until the canary is
# promoted. With the Secret gone its pods could not start, so stable went to
# 0/2 ready, the rollout went Degraded, and there was nothing left to roll back
# to.
#
# The lesson is the ordering: remove a Secret only once nothing references it,
# which means after the rollout that stops referencing it has completed. Deploy
# first, delete second.
#
# Delete this file once `kubectl get rs -n app -l app=web` shows only the
# current ReplicaSet with replicas.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web-session-secret
  namespace: app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: web-session-secret
  data:
    - secretKey: secret
      remoteRef:
        key: web-session-secret
