# The Postgres application password, projected into this namespace.
#
# Here rather than with the other cluster secrets because an ExternalSecret
# cannot be created in a namespace that does not exist yet, and this namespace
# is created by this same Application. Its twin, in the database namespace,
# lives in manifests/external-secrets.
#
# Two objects for one password is not duplication to remove: a Kubernetes
# Secret is namespace-scoped and cannot be read across namespaces, which is the
# whole reason the password is supplied instead of operator-generated.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-app-credentials
  namespace: app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: postgres-app-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        username: app
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: postgres-app-password
