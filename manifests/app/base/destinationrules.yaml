# Circuit breaking: past the pending-request limit Envoy returns 503 at once
# instead of queueing (overload otherwise queued requests for 20s+).
# One rule per host, canary hosts included. The policy is repeated, not
# anchored, because YAML anchors don't cross documents.

apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: api
spec:
  host: api
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
        # 250ms: tolerates cross-node connects during scale-up.
        connectTimeout: 250ms
      http:
        # Bounded queue; past this Envoy returns 503 immediately. 50 was itself the
        # bottleneck under load; 256 lets real limits show.
        http1MaxPendingRequests: 256
        # Unlimited, to keep HTTP/1.1 keep-alive.
        maxRequestsPerConnection: 0
    outlierDetection:
      # Eject a repeatedly failing pod for 30s.
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      # Never eject more than half, so a shared fault degrades instead of failing everything.
      maxEjectionPercent: 50
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: api-stable
spec:
  host: api-stable
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
        # As above.
        connectTimeout: 250ms
      http:
        http1MaxPendingRequests: 256
        maxRequestsPerConnection: 0
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: api-canary
spec:
  host: api-canary
  trafficPolicy:
