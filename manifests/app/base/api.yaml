# The api tier: the only workload that talks to Postgres. Own ServiceAccount,
# because mesh authorization rules match on mTLS identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
automountServiceAccountToken: false
---
# A Rollout, not a Deployment: canaries need a traffic split, which a
# Deployment can't do.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api
spec:
  replicas: 2
  # Keeps the previous ReplicaSet for a fast abort.
  revisionHistoryLimit: 2
  strategy:
    canary:
      # Both Services select api pods; Rollouts manages their selectors.
      canaryService: api-canary
      stableService: api-stable
      trafficRouting:
        istio:
          virtualService:
            name: api
            # Must match the named route in the VirtualService.
            routes:
              - primary
      # Pauses are where error rates are checked before more traffic moves.
      steps:
        - setWeight: 20
        - pause: { duration: 60s }
        - setWeight: 50
        - pause: { duration: 60s }
        - setWeight: 100
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: api
      # Stateless, so it runs on spot.
      nodeSelector:
        workload: stateless
      containers:
        - name: api
          image: api
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            # -rw is CloudNativePG's primary service.
            - name: DBHOST
              value: postgres-rw.database.svc.cluster.local
            - name: DBPORT
              value: "5432"
            - name: DB
              value: app
            # From Secret Manager via External Secrets, the same source CloudNativePG
            # bootstrapped the user from.
            - name: DBUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-app-credentials
                  key: username
            - name: DBPASS
              valueFrom:
                secretKeyRef:
                  name: postgres-app-credentials
                  key: password
            # CloudNativePG serves TLS 1.3 itself.
            - name: DBSSL
              value: "true"
            # Caches the summary aggregation; fails open if Redis is down.
            - name: REDIS_URL
              value: redis://redis.app.svc.cluster.local:6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          # Readiness checks Postgres; failing removes the pod from the Service.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          # Liveness hits /healthz, which touches nothing else, so a slow database
          # doesn't get busy pods killed.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            # Catches a wedged process, not a slow one.
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
# Rollouts adds a pod-template-hash to these selectors at runtime: stable →
# old ReplicaSet, canary → new.
apiVersion: v1
kind: Service
metadata:
  name: api-stable
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: api-canary
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
# Mesh-internal split (no gateways). Rollouts rewrites the `primary` route
# weights during a canary; Git holds the resting 100/0.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: api
spec:
  hosts:
    - api
  http:
    - name: primary
      route:
        - destination:
            host: api-stable
          weight: 100
        - destination:
            host: api-canary
          weight: 0
