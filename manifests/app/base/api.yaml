# The api tier: the only thing that talks to Postgres.
#
# Its own ServiceAccount, because identity is what the mesh's authorization
# rules are written against — "allow from the web service account" is a claim
# Envoy can verify with mTLS, unlike a namespace or an IP.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: api
      # Stateless: it holds nothing a preemption would lose, so it belongs on
      # the cheap pool. That is the whole reason the pools are split.
      nodeSelector:
        workload: stateless
      containers:
        - name: api
          image: api
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            # -rw is CloudNativePG's service for the primary. Writes must not
            # go to -ro or -r, which point at replicas.
            - name: DBHOST
              value: postgres-rw.database.svc.cluster.local
            - name: DBPORT
              value: "5432"
            - name: DB
              value: app
            # Projected from Secret Manager by External Secrets — the same
            # object CloudNativePG bootstrapped the user from, so the two cannot
            # drift. The password is in neither Git nor Terraform state.
            - name: DBUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-app-credentials
                  key: username
            - name: DBPASS
              valueFrom:
                secretKeyRef:
                  name: postgres-app-credentials
                  key: password
            # CloudNativePG serves TLS 1.3 and issues its own certificates, so
            # this connection is encrypted without the mesh being involved.
            - name: DBSSL
              value: "true"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/status
              port: 3000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /api/status
              port: 3000
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 3000
