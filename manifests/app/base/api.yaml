# The api tier: the only thing that talks to Postgres.
#
# Its own ServiceAccount, because identity is what the mesh's authorization
# rules are written against — "allow from the web service account" is a claim
# Envoy can verify with mTLS, unlike a namespace or an IP.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
automountServiceAccountToken: false
---
# A Rollout, not a Deployment.
#
# A Deployment can only do a rolling update: it swaps pods a few at a time and
# has no notion of sending a fraction of *traffic* anywhere. A canary is a
# traffic decision, so it needs the mesh to split requests and this controller
# to move the split over time.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api
spec:
  replicas: 2
  # Keep the previous version's ReplicaSet so a failed canary can be aborted
  # back to something that is already running, rather than re-pulled.
  revisionHistoryLimit: 2
  strategy:
    canary:
      # Two Services selecting the same pods; Rollouts keeps their selectors
      # pointed at the right ReplicaSet as the canary progresses.
      canaryService: api-canary
      stableService: api-stable
      trafficRouting:
        istio:
          virtualService:
            name: api
            # Must match the named http route in the VirtualService — Rollouts
            # rewrites the weights on that route and nothing else.
            routes:
              - primary
      # Percentages, with a pause at each. The pauses are what make this a
      # canary rather than a slower rolling update: they are where you watch
      # error rates before more traffic moves.
      steps:
        - setWeight: 20
        - pause: { duration: 60s }
        - setWeight: 50
        - pause: { duration: 60s }
        - setWeight: 100
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: api
      # Stateless: it holds nothing a preemption would lose, so it belongs on
      # the cheap pool. That is the whole reason the pools are split.
      nodeSelector:
        workload: stateless
      containers:
        - name: api
          image: api
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            # -rw is CloudNativePG's service for the primary. Writes must not
            # go to -ro or -r, which point at replicas.
            - name: DBHOST
              value: postgres-rw.database.svc.cluster.local
            - name: DBPORT
              value: "5432"
            - name: DB
              value: app
            # Projected from Secret Manager by External Secrets — the same
            # object CloudNativePG bootstrapped the user from, so the two cannot
            # drift. The password is in neither Git nor Terraform state.
            - name: DBUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-app-credentials
                  key: username
            - name: DBPASS
              valueFrom:
                secretKeyRef:
                  name: postgres-app-credentials
                  key: password
            # CloudNativePG serves TLS 1.3 and issues its own certificates, so
            # this connection is encrypted without the mesh being involved.
            - name: DBSSL
              value: "true"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/status
              port: 3000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /api/status
              port: 3000
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
# Two more Services, both selecting app=api.
#
# Rollouts adds a pod-template-hash to each selector as the canary runs, so at
# any moment `api-stable` points at the old ReplicaSet and `api-canary` at the
# new one. They look redundant in Git and are not at runtime.
apiVersion: v1
kind: Service
metadata:
  name: api-stable
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: api-canary
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
# The split itself.
#
# No `gateways` field, so this applies to mesh-internal traffic — which is all
# the api gets, since only web calls it. The weights below are the starting
# point; Argo Rollouts rewrites them on the route named `primary` as it walks
# the steps, and writes them back to 100/0 when the canary is promoted or
# aborted. Git holds the resting state, not the in-flight one.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: api
spec:
  hosts:
    - api
  http:
    - name: primary
      route:
        - destination:
            host: api-stable
          weight: 100
        - destination:
            host: api-canary
          weight: 0
