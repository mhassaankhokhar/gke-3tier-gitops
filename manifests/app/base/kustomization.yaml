# The base: no environment-specific image tags or replica counts; those are in the overlays.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: app

resources:
  - namespace.yaml
  - postgres-credentials.yaml
  - redis.yaml
  - api.yaml
  - web.yaml
  - hpa.yaml
  - mesh.yaml
  - destinationrules.yaml
