# The dev overlay — and the one file CI writes to.
#
# `kustomize edit set image` rewrites the `newName`/`newTag` pairs below, so a
# deploy is a one-line commit here rather than an edit anywhere in the base.
# That is the whole contract between the build pipeline and this repository:
# the pipeline names an image, and Argo CD does the deploying.
#
# The tags are exact commit SHAs, never `latest`. A moving tag means the
# cluster's contents stop being a function of this repository — two syncs of the
# same commit could run different code.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

images:
- name: api
  newName: us-central1-docker.pkg.dev/project-f9515611-f8df-4c08-8cb/gke-3tier/api
  newTag: 472a27fe2809049d306a4b03c66a223c679af069
- name: web
  newName: us-central1-docker.pkg.dev/project-f9515611-f8df-4c08-8cb/gke-3tier/web
  newTag: 472a27fe2809049d306a4b03c66a223c679af069

  # dynamicStableScale is a dev concession, not a default worth inheriting —
  # which is why it is patched here rather than set in the base.
  #
  # Without it a canary runs old and new at full size at once, so a rollout
  # needs roughly double the pods. This node pool cannot fit that: the rollout
  # deadlocked with new pods Pending and old ones unable to leave. With it, the
  # stable ReplicaSet scales down as canary traffic rises — at 20% canary,
  # stable drops to 80% — and the total never exceeds spec.replicas.
  #
  # The cost is the reason production should keep the default: aborting a bad
  # canary means the stable version has already been scaled down, so recovering
  # full capacity takes as long as starting pods. The default spends spare
  # capacity to buy an instant rollback, and in production that trade is worth
  # making. Here there is no spare capacity to spend.
patches:
- patch: |
    - op: add
      path: /spec/strategy/canary/dynamicStableScale
      value: true
  target:
    group: argoproj.io
    kind: Rollout
    name: web
- patch: |
    - op: add
      path: /spec/strategy/canary/dynamicStableScale
      value: true
  target:
    group: argoproj.io
    kind: Rollout
    name: api

# Cycle the pods so they pick up the smaller sidecar request.
#
# The sidecar CPU request went from 100m to 30m in 11-istiod.yaml, and that
# applies at injection: a pod already running keeps what it was created with.
# Five mesh pods were still holding 100m while both spot nodes sat at 96%
# reserved, so the saving only exists once they are replaced.
#
# restartAt rather than `kubectl rollout restart`. It is a field on the Rollout,
# so the restart is a commit like everything else — and per Argo Rollouts' docs
# it recreates pods in place rather than running the canary steps, honouring
# maxUnavailable and any PodDisruptionBudget. Each replacement asks for 70m less
# than the pod it replaces, so the pressure drops as it goes rather than at the
# end.
#
# The timestamp stays here afterwards: pods newer than it are left alone, so
# this is idempotent, and the value is a record of when the pods were last
# cycled.
- patch: |
    - op: add
      path: /spec/restartAt
      value: "2026-08-31T12:06:04Z"
  target:
    group: argoproj.io
    kind: Rollout
    name: web
- patch: |
    - op: add
      path: /spec/restartAt
      value: "2026-08-31T12:06:04Z"
  target:
    group: argoproj.io
    kind: Rollout
    name: api
# Redis is a Deployment, which has no restartAt — the annotation below is what
# `kubectl rollout restart` writes, stated in the file instead of typed at a
# prompt. One replica, so the cache is briefly unavailable; a miss falls through
# to Postgres.
- patch: |
    - op: add
      path: /spec/template/metadata/annotations
      value:
        kubectl.kubernetes.io/restartedAt: "2026-08-31T12:06:04Z"
  target:
    group: apps
    version: v1
    kind: Deployment
    name: redis
