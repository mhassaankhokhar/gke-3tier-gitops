# The dev overlay, and the only file CI writes: `kustomize edit set image`
# updates newName/newTag. Tags are commit SHAs, never `latest`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

images:
- name: api
  newName: us-central1-docker.pkg.dev/project-f9515611-f8df-4c08-8cb/gke-3tier/api
  newTag: bbc2cd6f619c3127171c56484b7147f631bc5269
- name: web
  newName: us-central1-docker.pkg.dev/project-f9515611-f8df-4c08-8cb/gke-3tier/web
  newTag: bbc2cd6f619c3127171c56484b7147f631bc5269

  # dynamicStableScale (dev only): stable scales down as the canary scales up,
  # so a rollout fits this pool. The trade-off is a slower abort; production should
  # keep the default.

# restartAt cycles Rollout pods through Git (in place, not via canary steps).
# Pods newer than the timestamp are left alone. Bump it when mesh config that
# applies only at pod start changes (e.g. proxyStatsMatcher in 11-istiod.yaml).
# Redis is a Deployment, so it uses the restartedAt annotation instead.
patches:
- patch: |
    - op: add
      path: /spec/strategy/canary/dynamicStableScale
      value: true
  target:
    group: argoproj.io
    kind: Rollout
    name: web
- patch: |
    - op: add
      path: /spec/strategy/canary/dynamicStableScale
      value: true
  target:
    group: argoproj.io
    kind: Rollout
    name: api
- patch: |
    - op: add
      path: /spec/restartAt
      value: "2026-09-01T06:43:53Z"
  target:
    group: argoproj.io
    kind: Rollout
    name: web
- patch: |
    - op: add
      path: /spec/restartAt
      value: "2026-09-01T06:43:53Z"
  target:
    group: argoproj.io
    kind: Rollout
    name: api
- patch: |
    - op: add
      path: /spec/template/metadata/annotations
      value:
        kubectl.kubernetes.io/restartedAt: "2026-09-01T06:43:53Z"
  target:
    group: apps
    kind: Deployment
    name: redis
    version: v1
