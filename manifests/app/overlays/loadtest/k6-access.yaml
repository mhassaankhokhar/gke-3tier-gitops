# The load generator's mesh identity and its access to web. In the loadtest
# overlay so it exists only while that overlay is selected.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k6
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: web-allow-k6
spec:
  selector:
    matchLabels:
      app: web
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/app/sa/k6"]
