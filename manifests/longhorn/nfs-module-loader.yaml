# Loads the nfs/nfsv4 kernel modules on every node: Longhorn RWX volumes are
# NFS mounts, and COS ships the modules unloaded. Longhorn's COS agent loads only
# iscsi_tcp. No nodeSelector, so new spot nodes get it automatically.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nfs-module-loader
  namespace: longhorn-system
spec:
  selector:
    matchLabels:
      app: nfs-module-loader
  template:
    metadata:
      labels:
        app: nfs-module-loader
    spec:
      # Every node, regardless of taints.
      tolerations:
        - operator: Exists
      containers:
        - name: modprobe
          image: busybox:1.37
          # Load, then idle; the module stays loaded for the node's lifetime.
          command:
            - sh
            - -c
            - |
              set -e
              modprobe nfs
              modprobe nfsv4
              grep -E '^nodev\snfs' /proc/filesystems
              echo "nfs client modules loaded on $(uname -n)"
              exec sleep infinity
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_MODULE"]
          volumeMounts:
            - name: host-modules
              mountPath: /lib/modules
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      volumes:
        - name: host-modules
          hostPath:
            path: /lib/modules
