# The RWX class the app requests by name. Exists to pin the Share Manager
# (the volume's NFS server) to the stable pool via shareManagerNodeSelector, since
# the global system-managed selector must stay empty (04-longhorn.yaml).
# Longhorn format: semicolon-separated key:value.
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: longhorn-rwx
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  # One per stateful node.
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
  fsType: ext4
  shareManagerNodeSelector: workload:stateful
