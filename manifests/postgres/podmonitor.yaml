# Scrapes CloudNativePG metrics, including backends and backends_waiting.
# PodMonitor rather than the deprecated spec.monitoring.enablePodMonitor.
# Both of these fail silently if wrong:
#   release: monitoring  matches Prometheus's podMonitorSelector
#   port: metrics        the container port name (9187)
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: postgres
  namespace: database
  labels:
    release: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: postgres
  podMetricsEndpoints:
    - port: metrics
      # 10s, like the envoy scrape, so per-stage rates are readable.
      interval: 10s
