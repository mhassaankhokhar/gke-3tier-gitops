# Who may reach Postgres. It is outside the mesh, so this NetworkPolicy
# (enforced by GKE Dataplane V2) stands in for an AuthorizationPolicy; it matches
# pod labels, not mTLS identity. Kept here, not in the app base, because the
# base rewrites every namespace to `app`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-api
  namespace: database
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: app
          podSelector:
            matchLabels:
              app: api
      ports:
        - protocol: TCP
          port: 5432
    # Replication and the operator connect from inside the database namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
    # Prometheus, metrics port only.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9187
