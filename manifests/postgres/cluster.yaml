# The database: two instances, one per stable node.
apiVersion: v1
kind: Namespace
metadata:
  name: database
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  # No istio-injection label: CloudNativePG does its own TLS and sidecars break
  # its startup (see 12-cnpg-operator.yaml).
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: database
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  instances: 2

  # RWO pd-balanced per instance; Postgres replicates, so no RWX/NFS.
  storage:
    size: 5Gi
    storageClass: standard-rwo

  # Stable pool: preemption would mean routine failovers.
  affinity:
    nodeSelector:
      workload: stateful
    # required, not preferred: two instances must sit on two nodes. With fewer
    # nodes than instances a pod stays Pending, which is the intended failure.
    enablePodAntiAffinity: true
    podAntiAffinityType: required

  postgresql:
    parameters:
      # Covers the api pool ceiling (6 pods × 25 = 150) plus replication and the
      # exporter. Raise together with api/db.js.
      max_connections: "200"

  # 1Gi: each connection is a backend process; sized for ~150 connections.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  bootstrap:
    initdb:
      database: app
      owner: app
      # Supplied, not generated: the api in the app namespace needs it, and Secrets
      # don't cross namespaces. Projected from Secret Manager into both. Must be
      # kubernetes.io/basic-auth with username = owner.
      secret:
        name: postgres-app-credentials
