# Cluster-wide configuration that depends on operators already being present:
# the ACME issuers (cert-manager's CRDs), the proxy placement policy
# (Tailscale's), and Argo CD's own certificate.
#
# Wave 0 — after cert-manager (-2) and the Tailscale operator (-1), so every CRD
# these objects use exists. Individual objects carry their own sync-wave where
# order matters between them: issuers before the certificate that references one.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: git@github.com:mhassaankhokhar/gke-3tier-gitops.git
    targetRevision: main
    path: manifests/platform
  destination:
    server: https://kubernetes.default.svc
    # Only a default for objects that do not name their own namespace; the
    # ClusterIssuers and ProxyClass are cluster-scoped and the Certificate names
    # the argocd namespace itself.
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
