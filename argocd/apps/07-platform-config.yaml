# Config that needs operator CRDs: ACME issuers, the Tailscale ProxyClass,
# Argo CD's certificate. Wave 0, after cert-manager and Tailscale.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: git@github.com:mhassaankhokhar/gke-3tier-gitops.git
    targetRevision: main
    path: manifests/platform
  destination:
    server: https://kubernetes.default.svc
    # Default only; these objects are cluster-scoped or name their namespace.
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
