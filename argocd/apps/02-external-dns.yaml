# external-dns, wave -1: writes Cloudflare records for Services and Ingresses.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns
    chart: external-dns
    targetRevision: 1.21.1
    helm:
      values: |
        provider:
          name: cloudflare
        env:
          - name: CF_API_TOKEN
            valueFrom:
              secretKeyRef:
                # From Secret Manager (manifests/external-secrets/cloudflare-token.yaml).
                name: cloudflare-api-token
                key: api-token
        # Only manage records under this zone, and only ones this cluster owns.
        domainFilters:
          - mhassankhokhar.site
        # TXT ownership records, so it only changes records it created.
        txtOwnerId: gke-3tier
        policy: sync
        nodeSelector:
          workload: stateful
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
