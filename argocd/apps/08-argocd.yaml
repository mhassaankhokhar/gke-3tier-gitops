# Argo CD manages its own chart. Terraform installs it once (ignore_changes);
# all runtime config lives here. A bad value here breaks the thing that applies
# it: recover with `helm rollback argocd -n argocd`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    # Syncing restarts argocd-server, so it runs after the platform waves.
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    # Same version as the Terraform install (modules/argocd); keep them in step.
    targetRevision: 10.4.1
    helm:
      values: |
        global:
          # Stable pool: reconciliation must survive spot preemption.
          nodeSelector:
            workload: stateful

        configs:
          params:
            # TLS from the argocd-server-tls Secret (cert-manager, DNS-01); reloaded
            # without a restart. Nothing else terminates TLS.
            server.insecure: false

          # Restores the argoproj.io/Application health check (removed in Argo CD 1.8)
          # so sync waves wait for each wave to be Healthy. Same key as the Terraform
          # install in modules/argocd. Script from the Argo CD docs (operator-manual/health).
          cm:
            resource.customizations.health.argoproj.io_Application: |
              hs = {}
              hs.status = "Progressing"
              hs.message = ""
              if obj.status ~= nil then
                if obj.status.health ~= nil then
                  hs.status = obj.status.health.status
                  if obj.status.health.message ~= nil then
                    hs.message = obj.status.health.message
                  end
                end
              end
              return hs

        # Single replicas; HA mode triples the footprint.
        controller:
          replicas: 1
        repoServer:
          replicas: 1
        applicationSet:
          replicas: 1

        server:
          replicas: 1

          # Tailscale LoadBalancer: a CGNAT address reachable only from the tailnet.
          service:
            type: LoadBalancer
            loadBalancerClass: tailscale
            annotations:
              # Keeps the proxy pod on the stable pool.
              tailscale.com/proxy-class: stable-pool

              # Tailnet machine name.
              tailscale.com/hostname: argocd

              # external-dns creates the record (CGNAT address, DNS-only in Cloudflare).
              external-dns.alpha.kubernetes.io/hostname: argo.mhassankhokhar.site
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      # Off: a rendering glitch could prune Argo CD's own Deployment.
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
