# Prometheus Operator CRDs, wave 5: Established before the operator
# (17-monitoring, wave 6) starts, because it checks for them only once at startup
# (prometheus-operator#7459). Keep on the same operator version as
# kube-prometheus-stack: 31.0.1 = v0.93.1 = kube-prometheus-stack 88.6.1.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-operator-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-operator-crds
    targetRevision: 31.0.1
    helm:
      values: |
        crds:
          annotations:
            # Never pruned by Argo CD: deleting a CRD deletes every resource of that kind.
            argocd.argoproj.io/sync-options: Prune=false
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      # Several of these CRDs exceed the client-side apply annotation limit.
      - ServerSideApply=true
