# External Secrets Operator — wave -3, before anything that needs a secret.
#
# Pulls the Cloudflare API token from GCP Secret Manager and projects it into the
# cluster. Authenticates through Workload Identity, so no key file exists
# anywhere and the token is in neither Git nor Terraform state.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    # Pinned. A controller that reconciles continuously will otherwise install
    # whatever upstream published last, with no commit behind it.
    targetRevision: 2.10.0
    helm:
      values: |
        installCRDs: true
        # The Kubernetes service account named in the Workload Identity binding
        # (terraform/envs/dev/main.tf). A mismatch here fails when a secret is
        # first synced, not at install time.
        serviceAccount:
          create: true
          name: external-secrets
        # Stable pool: this is the component every other secret consumer waits
        # on, so preemption here stalls the whole chain.
        nodeSelector:
          workload: stateful
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The CRDs this chart ships are large enough to exceed the client-side
      # annotation limit.
      - ServerSideApply=true
