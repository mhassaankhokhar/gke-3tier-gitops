# CloudNativePG operator (the database itself is wave 7). In-cluster rather
# than Cloud SQL by design. Not in the mesh: CNPG does its own TLS 1.3, and its
# docs list Istio sidecars as a cause of startup connectivity failures.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.29.0
    helm:
      values: |
        # Stable pool: the operator performs failover.
        nodeSelector:
          workload: stateful

        # Two replicas on different nodes: its webhooks are failurePolicy: Fail.
        # Leader-elected, so the second is a standby. Spread, not hard anti-affinity, so
        # rolling updates fit on two nodes.
        replicaCount: 2
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            matchLabelKeys:
              - pod-template-hash
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: cloudnative-pg
                app.kubernetes.io/instance: cnpg-operator

        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The chart ships the Cluster CRD, which is large.
      - ServerSideApply=true
