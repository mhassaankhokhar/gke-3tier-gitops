# Istio, part 3 of 3: the control plane.
#
# Wave 4, after base's CRDs and the CNI agent. istiod will start without the
# agent, but pods injected before the agent is ready get no iptables rules and
# their traffic silently bypasses the mesh — mTLS that appears to be on and is
# not.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: istiod
    targetRevision: 1.30.4
    helm:
      values: |
        global:
          platform: gke

        # Tell istiod that the CNI agent is installed.
        #
        # Without this the agent runs on every node and does nothing: istiod
        # keeps injecting the `istio-init` container, which applies the iptables
        # rules itself and therefore needs NET_ADMIN, NET_RAW, uid 0 and a
        # writable root filesystem — in every application pod. Verified against
        # the live injector, which carried `pilot.cni.enabled: false` while
        # `istio-cni-node` sat 5/5 ready.
        #
        # With it, the injected init container becomes `istio-validation`,
        # running `--run-validation --skip-rule-apply`: it checks that the agent
        # already wrote the redirection and applies nothing. Capabilities drop to
        # ALL, the filesystem is read-only, and it runs as 1337 rather than root.
        #
        # It fails closed. A pod landing on a node whose agent is not ready yet
        # cannot start, rather than starting outside the mesh — which matters
        # here because the application tier is on spot nodes that arrive without
        # warning, and a pod with no redirection would accept plaintext while
        # STRICT mTLS appeared to be on.
        #
        # Only new pods change; existing ones keep the rules they already have.
        cni:
          enabled: true

        pilot:
          # The control plane holds the mesh's configuration and certificate
          # authority. On a preemptible node, losing it means new pods cannot
          # get certificates — so it sits with the other controllers.
          nodeSelector:
            workload: stateful
          # One cluster, one mesh, a trial credit. Sized rather than left at the
          # chart's defaults, which assume a production cluster.
          autoscaleEnabled: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

        meshConfig:
          # Envoy starts before the application container does.
          #
          # Without this the app can begin making outbound calls before the
          # proxy is listening, and those calls fail — as connection refused,
          # which reads like the callee is down rather than like a startup race.
          defaultConfig:
            holdApplicationUntilProxyStarts: true
          # Access logs to stdout. A mesh whose traffic you cannot see is
          # harder to reason about than no mesh at all.
          accessLogFile: /dev/stdout
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  # istiod writes its CA certificate into this webhook after the chart creates
  # it, and the chart ships no caBundle at all — verified by rendering it. So
  # the live object always carries a field Git does not, and the Application
  # sits permanently OutOfSync while being entirely correct.
  #
  # Ignored rather than papered over with selfHeal off: selfHeal would keep
  # blanking the field istiod just wrote, and blanking it breaks validation of
  # every Istio resource until istiod notices and writes it back.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
        # Same class of field, second instance. The chart ships
        # failurePolicy: Ignore so that a cluster whose istiod is not up yet can
        # still accept Istio resources; istiod switches it to Fail once it is
        # ready to validate them. Reverting that would quietly turn off
        # validation — invalid Istio config would be accepted and simply not
        # work.
        - /webhooks/0/failurePolicy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
