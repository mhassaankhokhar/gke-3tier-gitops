# Istio, part 3 of 3: the control plane. Wave 4, after base's CRDs and the CNI
# agent; pods injected before the agent is ready bypass the mesh.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: istiod
    targetRevision: 1.30.4
    helm:
      values: |
        global:
          platform: gke

          proxy:
            # Sidecar request 30m: measured peaks are 5-10m. The CPU limit stays at the
            # chart's 2 cores. Memory unchanged (128Mi vs 53Mi peak). Applies to newly
            # injected pods only.
            resources:
              requests:
                cpu: 30m
                memory: 128Mi
              limits:
                cpu: 2000m
                memory: 1024Mi

        # The CNI agent is installed, so injected pods get istio-validation instead of
        # istio-init (no NET_ADMIN, non-root). Fails closed: a pod on a node whose agent
        # isn't ready won't start outside the mesh.
        cni:
          enabled: true

        pilot:
          # Stable pool: it is the mesh's control plane and CA.
          nodeSelector:
            workload: stateful
          # Two replicas on different nodes: the injector webhook is failurePolicy: Fail.
          # Fixed, not autoscaled; the stable pool has two nodes.
          replicaCount: 2
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              matchLabelKeys:
                - pod-template-hash
              labelSelector:
                matchLabels:
                  istio: pilot

          # Sized for this cluster, not the chart's production defaults.
          autoscaleEnabled: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

        meshConfig:
          # Envoy ready before the app starts, so early outbound calls don't get connection refused.
          defaultConfig:
            holdApplicationUntilProxyStarts: true
            # Adds the cluster stats the minimal default set omits (pending queues,
            # retries, outlier ejections), scoped to avoid a series explosion. Proxies pick
            # this up only on restart. Access logs go to stdout.
            proxyStatsMatcher:
              inclusionRegexps:
                - ".*upstream_cx_.*"
                - ".*upstream_rq_pending.*"
                - ".*upstream_rq_active.*"
                - ".*upstream_rq_retry.*"
                - ".*outlier_detection.*"
                - ".*circuit_breakers.*"
              inclusionSuffixes:
                - "upstream_rq_timeout"
          accessLogFile: /dev/stdout
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  # istiod writes the caBundle into this webhook at runtime; the chart ships
  # none, so it is ignored rather than reverted (reverting breaks validation).
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
        # istiod switches this from Ignore to Fail once ready; reverting disables validation.
        - /webhooks/0/failurePolicy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
