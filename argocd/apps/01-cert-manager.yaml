# cert-manager — wave -2, before anything that requests a certificate.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.1
    helm:
      values: |
        crds:
          enabled: true

        # Controller only; webhook and cainjector are pinned in their own blocks.
        # The webhook is failurePolicy: Fail, so it must not be on spot.
        nodeSelector:
          workload: stateful

        webhook:
          # Two, as the chart recommends for production.
          replicaCount: 2
          nodeSelector:
            kubernetes.io/os: linux
            workload: stateful
          # Spread, not hard anti-affinity, so a rolling update fits on two nodes;
          # matchLabelKeys scopes it to one revision.
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              matchLabelKeys:
                - pod-template-hash
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: webhook
                  app.kubernetes.io/instance: cert-manager
                  app.kubernetes.io/component: webhook

        cainjector:
          # Single leader-elected replica; failure only delays CA injection.
          nodeSelector:
            kubernetes.io/os: linux
            workload: stateful
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
