# Prometheus and Grafana — wave 6, after the mesh so its metrics exist to scrape.
#
# Sized deliberately rather than left at the chart's defaults, which assume a
# production cluster and request more CPU than this pool has free. The stateful
# nodes have roughly 1.2 cores unreserved between them; the defaults ask for
# more than that on their own, and the result would be Pending pods — the same
# failure this cluster has already produced three times.
#
# Alertmanager is off. There is nowhere to send an alert yet, and an alerting
# component with no destination is a thing that looks like monitoring without
# being it. It goes on when there is a channel to page.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 88.6.1
    helm:
      values: |
        alertmanager:
          enabled: false

        prometheusOperator:
          nodeSelector:
            workload: stateful
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits:   { memory: 256Mi }

        kube-state-metrics:
          nodeSelector:
            workload: stateful
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits:   { memory: 192Mi }

        prometheus-node-exporter:
          # No nodeSelector, deliberately. This is a DaemonSet reading each
          # node's own CPU, memory and disk — excluding the spot pool would
          # leave exactly the nodes a load test stresses without metrics, and
          # the gap would look like the pool being idle rather than unmonitored.
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { memory: 64Mi }

        grafana:
          nodeSelector:
            workload: stateful
          # Reached over the tailnet, like Argo CD. Grafana ships with a default
          # admin login and a query interface over every metric in the cluster;
          # that does not belong on the public internet.
          service:
            type: LoadBalancer
            loadBalancerClass: tailscale
            # 443, and TLS terminated by Grafana itself. Being on the tailnet
            # does not decide the scheme — the browser does, and since other
            # hosts on this domain are HTTPS it tries HTTPS here too, then finds
            # nothing listening. Serving a real certificate is less work than
            # arguing with HSTS.
            port: 443
            targetPort: 3000
            annotations:
              tailscale.com/proxy-class: stable-pool
              tailscale.com/hostname: grafana
              external-dns.alpha.kubernetes.io/hostname: grafana.mhassankhokhar.site
          # The admin password is generated by the chart into a Secret rather
          # than set here — a password in Git is a password published.
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { memory: 256Mi }
          persistence:
            enabled: false
          # The probes have to follow the scheme. Grafana now serves HTTPS, and
          # the chart's default probes speak HTTP — Grafana answered them with
          # "client sent an HTTP request to an HTTPS server" and a 400, so the
          # pod never became ready and the old HTTP one kept serving. Changing
          # a server's protocol without changing what checks it is the same
          # class of mistake as pointing a probe at an expensive endpoint.
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
              scheme: HTTPS
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
              scheme: HTTPS
            initialDelaySeconds: 60
            timeoutSeconds: 30
            failureThreshold: 10

          # The certificate cert-manager issues in manifests/platform. Grafana
          # reads it from the mounted path below.
          extraSecretMounts:
            - name: grafana-tls
              secretName: grafana-tls
              mountPath: /etc/grafana/certs
              readOnly: true

          grafana.ini:
            server:
              protocol: https
              cert_file: /etc/grafana/certs/tls.crt
              cert_key: /etc/grafana/certs/tls.key
              root_url: https://grafana.mhassankhokhar.site

        prometheus:
          prometheusSpec:
            nodeSelector:
              workload: stateful
            # Seven days, capped at 10GB. retentionSize matters as much as
            # retention: without it a busy fortnight fills the volume and
            # Prometheus stops ingesting, which is a silent loss of exactly the
            # data you wanted.
            retention: 7d
            retentionSize: 9GB
            resources:
              requests: { cpu: 150m, memory: 512Mi }
              limits:   { memory: 1536Mi }
            storageSpec:
              volumeClaimTemplate:
                spec:
                  # RWO, not Longhorn's RWX. One Prometheus, one volume, and a
                  # time-series database on shared NFS-backed storage invites
                  # the same locking and fsync problems as a database would.
                  storageClassName: standard-rwo
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 10Gi

            # The chart's Prometheus discovers targets through ServiceMonitors,
            # not through prometheus.io annotations — which is how Istio's
            # sidecars advertise themselves. Without this job, every envoy_ and
            # istio_ metric is missing: no request rates, no p95 by service, no
            # mTLS visibility. The relabel rule below is Istio's own.
            additionalScrapeConfigs:
              - job_name: 'istio-envoy-stats'
                metrics_path: /stats/prometheus
                kubernetes_sd_configs:
                  - role: pod
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_container_port_name]
                    action: keep
                    regex: '.*-envoy-prom'
                  - source_labels: [__meta_kubernetes_namespace]
                    target_label: namespace
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The stack ships very large CRDs.
      - ServerSideApply=true
