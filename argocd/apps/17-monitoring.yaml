# Prometheus and Grafana, wave 6 (after the mesh). Resources sized to fit the
# stable pool; the chart defaults leave pods Pending. Alertmanager is off until
# there is a channel to send alerts to.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 88.6.1
    helm:
      values: |
        # CRDs come from 19-prometheus-operator-crds.yaml a wave earlier: the operator
        # checks for them once, at startup (prometheus-operator#7459).
        crds:
          enabled: false

        alertmanager:
          enabled: false

        prometheusOperator:
          nodeSelector:
            workload: stateful
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits:   { memory: 256Mi }

        kube-state-metrics:
          nodeSelector:
            workload: stateful
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits:   { memory: 192Mi }

        prometheus-node-exporter:
          # No nodeSelector: a DaemonSet that must cover every node, spot included.
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { memory: 64Mi }

        grafana:
          nodeSelector:
            workload: stateful
          # Tailnet only: Grafana exposes every metric and has an admin login.
          service:
            type: LoadBalancer
            loadBalancerClass: tailscale
            # Grafana terminates TLS itself; browsers expect HTTPS on this domain.
            port: 443
            targetPort: 3000
            annotations:
              tailscale.com/proxy-class: stable-pool
              tailscale.com/hostname: grafana
              external-dns.alpha.kubernetes.io/hostname: grafana.mhassankhokhar.site
          # Admin credentials from Secret Manager via
          # manifests/external-secrets/grafana-admin.yaml. The chart's generated password
          # changes on every Argo CD render.
          admin:
            existingSecret: grafana-admin

          # Sized from observed usage with dashboards loaded (256Mi was OOMKilled).
          # Request close to the limit so the scheduler sees the real size.
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits:   { memory: 512Mi }
          persistence:
            enabled: false
          # HTTPS probes, because Grafana serves HTTPS.
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
              scheme: HTTPS
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
              scheme: HTTPS
            initialDelaySeconds: 60
            timeoutSeconds: 30
            failureThreshold: 10

          # HTTPS scrape. insecureSkipVerify: the target is a pod IP, the cert is for the hostname.
          serviceMonitor:
            scheme: https
            tlsConfig:
              insecureSkipVerify: true

          sidecar:
            # Sized from observed usage (~75Mi each).
            resources:
              requests: { cpu: 10m, memory: 96Mi }
              limits:   { memory: 192Mi }
            # Reload call goes over HTTPS.
            skipTlsVerify: true
            dashboards:
              reloadURL: "https://localhost:3000/api/admin/provisioning/dashboards/reload"

          # Certificate issued by cert-manager (manifests/platform).
          extraSecretMounts:
            - name: grafana-tls
              secretName: grafana-tls
              mountPath: /etc/grafana/certs
              readOnly: true

          grafana.ini:
            server:
              protocol: https
              cert_file: /etc/grafana/certs/tls.crt
              cert_key: /etc/grafana/certs/tls.key
              root_url: https://grafana.mhassankhokhar.site

        prometheus:
          prometheusSpec:
            nodeSelector:
              workload: stateful
            # retentionSize too, so a full volume can't stop ingestion.
            retention: 7d
            retentionSize: 9GB
            resources:
              requests: { cpu: 150m, memory: 512Mi }
              limits:   { memory: 1536Mi }
            storageSpec:
              volumeClaimTemplate:
                spec:
                  # RWO, not Longhorn RWX: a TSDB shouldn't sit on NFS.
                  storageClassName: standard-rwo
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 10Gi

            # Istio sidecars advertise via prometheus.io annotations, which the
            # ServiceMonitor-based setup ignores; this job (Istio's relabel rules) collects
            # the envoy_ and istio_ metrics.
            additionalScrapeConfigs:
              - job_name: 'istio-envoy-stats'
                metrics_path: /stats/prometheus
                # 10s, so a 40s rate() window has enough samples to read one load-test stage.
                scrape_interval: 10s
                kubernetes_sd_configs:
                  - role: pod
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_container_port_name]
                    action: keep
                    regex: '.*-envoy-prom'
                  - source_labels: [__meta_kubernetes_namespace]
                    target_label: namespace
                  - source_labels: [__meta_kubernetes_pod_name]
                    target_label: pod
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Kept on so existing objects keep their apply method.
      - ServerSideApply=true
