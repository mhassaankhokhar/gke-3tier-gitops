# The ingress gateway, the only public address; everything else is
# tailnet-only. Istio's gateway chart, so both tiers use one traffic API.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: gateway
    targetRevision: 1.30.4
    helm:
      releaseName: istio-ingressgateway
      values: |
        # The selector every Gateway resource matches on.
        labels:
          istio: ingressgateway

        service:
          annotations:
            # external-dns points this name at the load balancer's address.
            external-dns.alpha.kubernetes.io/hostname: gke-3tier.mhassankhokhar.site

          # A cloud load balancer: NodePort can't listen on 80/443.
          type: LoadBalancer
          ports:
            # Port 80 exists to redirect to 443, not to serve.
            - name: http2
              port: 80
              targetPort: 8080
            - name: https
              port: 443
              targetPort: 8443

        # Stable pool: it is the front door.
        nodeSelector:
          workload: stateful

        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
