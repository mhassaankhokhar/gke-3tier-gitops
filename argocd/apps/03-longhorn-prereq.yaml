# Longhorn's GKE COS node agent, wave 0: loads iscsi_tcp and runs iscsid,
# which no GKE node image provides. From Longhorn's repo at the chart's version.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn-prereq
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/longhorn/longhorn.git
    # Pinned to the tag matching the chart version in 04-longhorn.yaml.
    targetRevision: v1.12.1
    path: deploy/prerequisite
    directory:
      # Only the GKE COS agent from this directory.
      include: longhorn-gke-cos-node-agent.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
