# Istio, part 1 of 3: CRDs and cluster-scoped resources. Then cni, then
# istiod (which needs these CRDs). Sidecar mode, not ambient.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-base
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: base
    targetRevision: 1.30.4
    helm:
      values: |
        defaultRevision: default
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  # istiod writes the caBundle into this webhook at runtime; the chart ships
  # none, so it is ignored rather than reverted (reverting breaks validation).
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
        # istiod switches this from Ignore to Fail once ready; reverting disables validation.
        - /webhooks/0/failurePolicy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Istio's CRDs exceed the client-side annotation limit.
      - ServerSideApply=true
