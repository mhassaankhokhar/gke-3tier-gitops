# The application, wave 8 (last): needs the mesh, Redis and Postgres.
# Kustomize because it is our own manifests (charts are for third-party
# components). CI deploys by committing a new image tag to the overlay.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  project: default
  source:
    repoURL: git@github.com:mhassaankhokhar/gke-3tier-gitops.git
    targetRevision: main
    # overlays/dev is normal (CI writes tags there); overlays/loadtest is for
    # measurement. Switch here in a commit: root's selfHeal reverts live edits.
    path: manifests/app/overlays/loadtest
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    # The HPA owns replicas.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: argoproj.io
      kind: Rollout
      jsonPointers:
        - /spec/replicas
    # Argo Rollouts owns the weights during a canary; Git holds the resting state.
    - group: networking.istio.io
      kind: VirtualService
      jsonPointers:
        - /spec/http/0/route/0/weight
        - /spec/http/0/route/1/weight
