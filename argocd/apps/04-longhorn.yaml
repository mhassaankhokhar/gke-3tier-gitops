# Longhorn — wave 1, after its node agent (wave 0) has installed iscsid.
#
# Provides the ReadWriteMany StorageClass.
#
# GKE's default pd-balanced is ReadWriteOnce: a volume attaches to one node at a
# time, so two replicas on different nodes leave the second in
# FailedAttachVolume. Longhorn fills that gap.
#
# NOT used for PostgreSQL. CloudNativePG gives each instance its own RWO volume
# and replicates at the database layer; Postgres on shared NFS-backed storage
# invites locking and fsync problems.
#
# Longhorn over Filestore (GCP's managed NFS) on purpose: it runs on any cluster,
# so the same manifests still work on a local k3d cluster after the trial credit.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://charts.longhorn.io
    chart: longhorn
    targetRevision: 1.12.1
    helm:
      values: |
        # Longhorn's pre-upgrade check runs as a Helm pre-upgrade hook. ArgoCD
        # translates Helm hooks into PreSync, so it fires even on a first install
        # — before the ServiceAccount it needs exists, leaving the Job stuck on
        # "serviceaccount longhorn-service-account not found" and the Application
        # permanently Missing.
        #
        # The chart's own values.yaml says to disable this "when installing
        # Longhorn using Argo CD or other GitOps solutions".
        preUpgradeChecker:
          jobEnabled: false

        # Pinned to the stable pool. Longhorn replicates volume data across the
        # nodes it runs on — putting replicas on preemptible nodes means constant
        # rebuilds, which is the opposite of what a storage layer is for.
        #
        # This pins the STORAGE plane only. A node without longhorn-manager is
        # not a Longhorn node at all, so this alone is what keeps replicas and
        # instance-managers off the spot pool — no second setting is needed for
        # that, and `kubectl get nodes.longhorn.io` lists only the stateful pool.
        longhornManager:
          nodeSelector:
            workload: stateful
        longhornDriver:
          nodeSelector:
            workload: stateful
        longhornUI:
          nodeSelector:
            workload: stateful

        defaultSettings:
          # V1 data engine only — Longhorn's COS documentation states that COS
          # clusters currently support V1 data volumes.
          v2DataEngine: false
          # Two stateful nodes, so two replicas is the most that can be placed.
          defaultReplicaCount: 2

          # Replica data goes only where the node pool says it may.
          #
          # Longhorn otherwise gives every new node a default disk, which makes
          # it eligible to hold replicas. With this enabled it creates a disk
          # only on nodes labelled node.longhorn.io/create-default-disk, which
          # the stateful pool carries from its node_config in Terraform — so a
          # replacement node arrives with the right answer already.
          #
          # This is what allows longhorn-manager to run on the spot pool. It has
          # to: Longhorn refuses to attach a volume to a node it has not
          # registered, RWX included, so a pool without the manager cannot mount
          # anything. Manager everywhere, disks only here.
          createDefaultDiskLabeledNodes: true

          # Set to the empty string, not removed. Removing the key does not
          # clear the setting: Longhorn's docs say that when a setting is
          # absent from the ConfigMap it "will use the default value in
          # Longhorn or the customized values previously configured", and an
          # empty string is what actually cleans it up. Deleting the line left
          # the Setting CR reading workload:stateful with csi-plugin still
          # pinned, and ArgoCD reported Synced/Healthy throughout — the
          # manifest was applied, the effect was not.
          systemManagedComponentsNodeSelector: ""
          #
          # It was, as "workload:stateful", on the assumption that pinning
          # everything Longhorn owns to the stable pool was the safe default.
          # It is not: Longhorn's docs class the CSI Driver as a system-managed
          # component, so that one line also pinned longhorn-csi-plugin, and a
          # DaemonSet with a nodeSelector does not follow new nodes it excludes.
          #
          #   longhorn-csi-plugin   DESIRED 2   NODE SELECTOR workload=stateful
          #
          # The CSI node plugin is what performs the mount, on the node the
          # consuming pod runs on. RWX exists here for the web/api tier, which
          # runs on spot — so the one pool that had to be able to mount a
          # Longhorn volume was the only pool that could not. Nothing on the
          # stateful pool needs RWX at all; Postgres takes RWO.
          #
          # The rule this cost: placement follows the volume's CONSUMER, and
          # anything a replaceable node needs must be a DaemonSet with no
          # nodeSelector, because that is the only thing a new node gets by
          # itself.
          #
          # Share Manager is system-managed too, and it must NOT drift onto
          # spot — it is the NFS server for every RWX volume, so preempting it
          # breaks every client mount. It is pinned per-StorageClass instead,
          # with shareManagerNodeSelector; see manifests/longhorn.

        persistence:
          # NOT the cluster default: pd-balanced stays default so anything that
          # wants RWO (Postgres) gets it without knowing about Longhorn. RWX
          # workloads ask for this class by name.
          defaultClass: false
          defaultClassReplicaCount: 2

        # The UI has no authentication of its own — anyone who reaches it can
        # view, back up or delete volumes. So no ingress and no LoadBalancer:
        # it is reached over Tailscale only.
        ingress:
          enabled: false
        service:
          ui:
            type: ClusterIP
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
