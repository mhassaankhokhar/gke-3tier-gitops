# Longhorn, wave 1 (its node agent is wave 0): the ReadWriteMany StorageClass
# for web/api. Postgres uses RWO pd-balanced instead. Chosen over Filestore so
# the manifests also run off GCP.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://charts.longhorn.io
    chart: longhorn
    targetRevision: 1.12.1
    helm:
      values: |
        # Disabled as the chart's values.yaml advises for Argo CD: the pre-upgrade
        # hook runs as PreSync on first install, before its ServiceAccount exists.
        preUpgradeChecker:
          jobEnabled: false

        # Stable pool. longhornManager is not pinned: Longhorn only attaches volumes
        # on nodes running the manager, and the app runs on spot. Replicas stay off spot
        # via createDefaultDiskLabeledNodes below.
        longhornDriver:
          nodeSelector:
            workload: stateful
        longhornUI:
          nodeSelector:
            workload: stateful

        defaultSettings:
          # COS supports V1 data volumes only.
          v2DataEngine: false
          # One per stateful node.
          defaultReplicaCount: 2

          # Lets Longhorn keep PDBs only for nodes holding a volume's last replica;
          # otherwise every node gets a PDB and none can drain or scale down.
          kubernetesClusterAutoscalerEnabled: true

          # Default disks only on nodes labelled node.longhorn.io/create-default-disk
          # (the stateful pool, set in Terraform). Other nodes mount but never store replicas.
          createDefaultDiskLabeledNodes: true

          # Empty string, not removed: a removed key keeps the previous value. Must stay
          # unset so the CSI plugin DaemonSet runs on every node, including spot. Share
          # Manager is pinned per StorageClass instead (manifests/longhorn).
          systemManagedComponentsNodeSelector: ""

        persistence:
          # Not the default class: RWO users (Postgres) get pd-balanced; RWX asks for this by name.
          defaultClass: false
          defaultClassReplicaCount: 2

        # The UI has no auth, so no ingress: Tailscale only.
        ingress:
          enabled: false
        service:
          ui:
            type: ClusterIP
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
