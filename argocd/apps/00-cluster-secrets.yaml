# ExternalSecrets, wave -1, before their consumers. ESO itself is in the
# Terraform seed (ArgoCD needs it to read this repo), so its CRDs already exist.
# SSH URL: the repo is private and read with a deploy key.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: git@github.com:mhassaankhokhar/gke-3tier-gitops.git
    targetRevision: main
    path: manifests/external-secrets
  destination:
    server: https://kubernetes.default.svc
    # Default only; each ExternalSecret sets its own namespace.
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
