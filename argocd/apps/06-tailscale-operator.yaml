# Tailscale operator, wave -1: admin UIs (Argo CD, Longhorn, Grafana) are
# tailnet-only. OAuth credentials come from an ExternalSecret
# (manifests/external-secrets), not from this chart.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://pkgs.tailscale.com/helmcharts
    chart: tailscale-operator
    targetRevision: 1.102.3
    helm:
      values: |
        # Empty so the chart doesn't render its own operator-oauth Secret.
        oauth:
          clientId: ""
          clientSecret: ""

        operatorConfig:
          # Must have no owner in tagOwners, so only this credential can use it.
          defaultTags:
            - "tag:k8s-operator"
          # Stable pool: it maps Services to tailnet devices.
          nodeSelector:
            kubernetes.io/os: linux
            workload: stateful
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The chart ships large CRDs.
      - ServerSideApply=true
