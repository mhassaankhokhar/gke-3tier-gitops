# What the application tier needs from Longhorn, as opposed to what Longhorn
# needs to run — wave 2, so the chart's CRDs and controllers already exist.
#
# Two objects, both consequences of the same fact: the pool that consumes RWX is
# the pool that can disappear.
#
#   nfs-module-loader   the NFS client module on every node, spot included
#   longhorn-rwx        the class the app asks for, with the NFS server pinned
#                       to the stable pool
#
# Raw manifests rather than a chart: two cluster-specific objects, and wrapping
# them would add a layer with nothing in it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn-storage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: git@github.com:mhassaankhokhar/gke-3tier-gitops.git
    targetRevision: main
    path: manifests/longhorn
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
