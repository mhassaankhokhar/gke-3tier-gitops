# Istio, part 2 of 3: the CNI node agent. Replaces the privileged istio-init
# container (NET_ADMIN, NET_RAW) in every pod with one agent per node.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-cni
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: cni
    targetRevision: 1.30.4
    helm:
      values: |
        # global.platform=gke is not set: its bin-dir autodetection needs the live
        # KubeVersion, which Argo CD's `helm template` doesn't have, so it falls back to
        # /opt/cni/bin (read-only on COS). The profile also overrides an explicit
        # cniBinDir. Its two effects are set directly: this path and resourceQuotas below.
        cniBinDir: /home/kubernetes/bin

        # GKE schedules system-node-critical pods only in namespaces with a quota for
        # that priority class; without it the DaemonSet silently creates no pods.
        resourceQuotas:
          enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
